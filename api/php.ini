; php.ini para el runtime de vercel-php (se concatena al default; lo ultimo gana).
;
; PHP 8.5 marca como deprecated la constante PDO::MYSQL_ATTR_SSL_CA, que usa el
; config de base de datos por defecto de Laravel (vendor) y el publicado. Como
; esos avisos se disparan al cargar la config -- antes de que Laravel instale su
; manejador de errores -- se imprimen en la respuesta. Los silenciamos.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
